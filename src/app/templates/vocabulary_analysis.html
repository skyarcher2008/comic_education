<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词汇分析报告 - 漫画翻译系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .report-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background: #f8f9fa;
        }
        .report-content {
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            background: white;
            border-radius: 4px;
        }
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .word-category {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .new-word {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
        }
        .proper-noun {
            background: #f3e5f5;
            border-left: 4px solid #9c27b0;
        }
        .name {
            background: #e8f5e8;
            border-left: 4px solid #4caf50;
        }
        .btn-download {
            background: #28a745;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            margin-right: 10px;
        }
        .btn-download:hover {
            background: #218838;
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">
                <img src="{{ url_for('static', filename='pic/logo.png') }}" alt="Logo" height="30">
                漫画翻译系统
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('main.index') }}">返回首页</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <h1 class="mb-4">📚 词汇分析报告</h1>
                
                <!-- 统计概览 -->
                <div class="stats-card">
                    <h3><i class="bi bi-bar-chart"></i> 学习统计</h3>
                    <div class="row mt-3">
                        <div class="col-md-3">
                            <div class="text-center">
                                <h4 id="totalReports">-</h4>
                                <p>总报告数</p>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="text-center">
                                <h4 id="totalWords">-</h4>
                                <p>已分析词汇</p>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="text-center">
                                <h4 id="newWords">-</h4>
                                <p>待学习生词</p>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="text-center">
                                <h4 id="learningProgress">-</h4>
                                <p>学习进度</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 报告列表 -->
                <div class="card">
                    <div class="card-header">
                        <h5>📋 词汇分析报告列表</h5>
                    </div>
                    <div class="card-body">
                        <div id="reportsList">
                            <div class="text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">加载中...</span>
                                </div>
                                <p class="mt-2">正在加载报告列表...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 报告详情 -->
                <div id="reportDetail" class="card mt-4" style="display: none;">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 id="reportTitle">报告详情</h5>
                        <div>
                            <button class="btn btn-sm btn-secondary" onclick="closeReport()">关闭</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="reportContent" class="report-content"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadVocabularyStats();
            loadReportsList();
        });

        // 加载词汇统计
        async function loadVocabularyStats() {
            try {
                const response = await fetch('/api/vocabulary/stats');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('totalReports').textContent = data.stats.total_reports;
                    document.getElementById('totalWords').textContent = data.stats.total_words_analyzed;
                    document.getElementById('newWords').textContent = data.stats.total_new_words;
                    document.getElementById('learningProgress').textContent = '计算中...';
                }
            } catch (error) {
                console.error('加载统计数据失败:', error);
            }
        }

        // 加载报告列表
        async function loadReportsList() {
            try {
                const response = await fetch('/api/vocabulary/reports');
                const data = await response.json();
                
                const listContainer = document.getElementById('reportsList');
                
                if (data.success && data.reports.length > 0) {
                    listContainer.innerHTML = '';
                    
                    data.reports.forEach(report => {
                        const reportCard = document.createElement('div');
                        reportCard.className = 'report-card';
                        reportCard.innerHTML = `
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6>${report.filename}</h6>
                                    <small class="text-muted">
                                        修改时间: ${new Date(report.modified * 1000).toLocaleString()}
                                        | 文件大小: ${(report.size / 1024).toFixed(1)} KB
                                    </small>
                                </div>
                                <div>
                                    <button class="btn btn-sm btn-primary me-2" onclick="viewReport('${report.filename}')">
                                        查看
                                    </button>
                                    <a href="/api/vocabulary/download/${report.filename}" class="btn-download">
                                        下载
                                    </a>
                                </div>
                            </div>
                        `;
                        listContainer.appendChild(reportCard);
                    });
                } else {
                    listContainer.innerHTML = `
                        <div class="text-center py-5">
                            <h5 class="text-muted">暂无词汇分析报告</h5>
                            <p class="text-muted">请先进行漫画翻译并启用词汇分析功能</p>
                            <a href="{{ url_for('main.index') }}" class="btn btn-primary">开始翻译</a>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('加载报告列表失败:', error);
                document.getElementById('reportsList').innerHTML = `
                    <div class="alert alert-danger">
                        加载报告列表失败: ${error.message}
                    </div>
                `;
            }
        }

        // 查看报告详情
        async function viewReport(filename) {
            try {
                const response = await fetch(`/api/vocabulary/report/${filename}`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('reportTitle').textContent = filename;
                    document.getElementById('reportContent').innerHTML = marked.parse(data.content);
                    document.getElementById('reportDetail').style.display = 'block';
                    
                    // 滚动到报告详情
                    document.getElementById('reportDetail').scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert('加载报告失败: ' + data.message);
                }
            } catch (error) {
                console.error('查看报告失败:', error);
                alert('查看报告失败: ' + error.message);
            }
        }

        // 关闭报告详情
        function closeReport() {
            document.getElementById('reportDetail').style.display = 'none';
        }
    </script>
</body>
</html>
